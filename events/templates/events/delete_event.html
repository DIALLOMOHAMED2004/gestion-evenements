{% extends 'authentification/base.html' %}

{% block title %}Supprimer l'événement{% endblock %}

{% block content %}
<div class="container py-4">
    <h2>Supprimer l'événement</h2>
    <p>Êtes-vous sûr de vouloir supprimer l'événement : <strong>{{ event.title }}</strong> ?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Supprimer</button>
        <a href="{% url 'events:event_detail' event.id %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
