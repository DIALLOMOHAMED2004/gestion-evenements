{% extends 'authentification/base.html' %}

{% block title %}Modifier l'événement{% endblock %}

{% block content %}
<div class="container py-4">
    <h2>Modifier l'événement</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label for="title" class="form-label">Titre de l'événement*</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ event.title }}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description*</label>
            <textarea class="form-control" id="description" name="description" rows="4" required>{{ event.description }}</textarea>
        </div>
        <div class="mb-3">
            <label for="location" class="form-label">Lieu*</label>
            <input type="text" class="form-control" id="location" name="location" value="{{ event.location }}" required>
        </div>
        <div class="mb-3">
            <label for="image" class="form-label">Image de l'événement</label>
            {% if event.image %}
            <div class="mb-2">
                <img src="{{ event.image.url }}" alt="Image actuelle" class="img-thumbnail" style="max-height: 200px;">
            </div>
            {% endif %}
            <input type="file" class="form-control" id="image" name="image" accept="image/*">
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Catégorie*</label>
            <select class="form-select" id="category" name="category" required>
                {% for category in categories %}
                    <option value="{{ category.id }}" {% if category.id == event.category.id %}selected{% endif %}>{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="start_date" class="form-label">Date et heure de début*</label>
                <input type="datetime-local" class="form-control" id="start_date" name="start_date" value="{{ event.start_date|date:"Y-m-d\TH:i" }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="end_date" class="form-label">Date et heure de fin*</label>
                <input type="datetime-local" class="form-control" id="end_date" name="end_date" value="{{ event.end_date|date:"Y-m-d\TH:i" }}" required>
            </div>
        </div>
        <div class="mb-3">
            <label for="available_seats" class="form-label">Nombre de places disponibles*</label>
            <input type="number" class="form-control" id="available_seats" name="available_seats" value="{{ event.available_seats }}" min="1" required>
        </div>
        <div class="mb-3">
            <label for="event_type" class="form-label">Type d'événement*</label>
            <select class="form-select" id="event_type" name="event_type" required>
                <option value="FREE" {% if event.event_type == 'FREE' %}selected{% endif %}>Gratuit</option>
                <option value="PAID" {% if event.event_type == 'PAID' %}selected{% endif %}>Payant</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="ticket_price" class="form-label">Prix du billet (€)*</label>
            <input type="number" class="form-control" id="ticket_price" name="ticket_price" value="{{ event.ticket_price }}" min="0" step="0.01" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Visibilité de l'événement*</label>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="is_public" name="visibility" value="public" {% if not event.is_private %}checked{% endif %}>
                <label class="form-check-label" for="is_public">Événement public</label>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="is_private" name="visibility" value="private" {% if event.is_private %}checked{% endif %}>
                <label class="form-check-label" for="is_private">Événement privé</label>
                <small class="form-text text-muted d-block">
                    Les événements privés sont accessibles uniquement via un lien d'invitation.
                </small>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Modifier l'événement</button>
    </form>
</div>
{% endblock %}
